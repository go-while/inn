##  Build and test upstream INN (InterNetNews/inn) on many systems: branch
##  main (the coming 2.8.0) and branch 2.7 (the stable line, the coming
##  2.7.5), each with only the patches in patches/<ref>/ that upstream does
##  not have yet.  It catches breakage caused by new compilers, C libraries
##  and runner images before it reaches the maintainers' CI.
##
##  - Ubuntu: upstream's own ci/install and ci/test (make warnings, i.e.
##    -Werror, in three configurations) with gcc and clang, on x86-64 and
##    ARM64, on the current and the previous LTS.
##  - Sanitizers: AddressSanitizer and UndefinedBehaviorSanitizer, make check.
##  - Linux distributions: 20 container images, through e2e-distro (build,
##    make check).
##  - The fork's e2e tests (branch e2e) against plain upstream, for
##    information only: which fork fixes upstream still lacks.
##  - FreeBSD, OpenBSD, NetBSD, DragonFly BSD and OmniOS (illumos) in VMs.
##  - macOS only when started by hand with "macos" ticked.
##
##  Runs on a push to this branch, weekly, and by hand (Actions, main-matrix,
##  "Run workflow"), where one ref (branch, tag or commit) can be chosen
##  instead of main and 2.7.  GitHub runs scheduled workflows only from the
##  default branch of the repository, so the schedule takes effect only if
##  this file is there too.

name: main-matrix

"on":
  push:
    branches: [main-matrix]
  workflow_dispatch:
    inputs:
      ref:
        description: InterNetNews/inn ref to test (empty = main and 2.7)
        default: ""
      patches:
        description: Apply the patches in patches/<ref>/ that upstream lacks
        type: boolean
        default: true
      macos:
        description: Also build on macOS
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: main-matrix-${{ github.ref }}-${{ inputs.ref || 'all' }}
  cancel-in-progress: true

jobs:
  source:
    name: Source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v7
        with:
          path: matrix
          persist-credentials: false
      - name: Refs
        id: refs
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ]; then
            echo "refs=[\"$REF\"]" >>"$GITHUB_OUTPUT"
            echo "$REF" >refs.txt
          else
            echo 'refs=["main","2.7"]' >>"$GITHUB_OUTPUT"
            printf '%s\n' main 2.7 >refs.txt
          fi
      - name: Install autoconf
        run: sudo apt-get -qq update && sudo apt-get -qq install -y autoconf >/dev/null
      # One tarball per ref, inn-src-<ref>.tar.gz ("/" in the ref becomes
      # "_"): inn/ is the source tree with configure generated; e2e-distro
      # sits next to it, outside the tree, so that upstream's make
      # check-manifest does not see it.  (inputs.patches is empty on a push
      # or a schedule, and an empty value equals false in an expression.)
      - name: Fetch, patch, make the tarballs
        env:
          PATCHES: ${{ github.event_name != 'workflow_dispatch' || inputs.patches }}
        run: |
          while read -r ref; do
            safe=$(printf '%s' "$ref" | tr '/' '_')
            rm -rf src && git init -q src
            git -C src fetch -q --depth 1 https://github.com/InterNetNews/inn.git "$ref"
            git -C src checkout -q FETCH_HEAD
            {
              echo "### InterNetNews/inn $ref"
              echo "commit \`$(git -C src rev-parse --short=9 HEAD)\`: $(git -C src log -1 --format=%s)"
              echo
            } >>"$GITHUB_STEP_SUMMARY"
            if [ "$PATCHES" = true ] && [ -d "matrix/patches/$safe" ]; then
              sh matrix/apply-patches "matrix/patches/$safe" src
            else
              echo "- no patches" >>"$GITHUB_STEP_SUMMARY"
            fi
            (cd src && ./autogen)
            tar czf "inn-src-$safe.tar.gz" --exclude=.git --transform 's,^src,inn,' src \
                -C matrix e2e-distro
          done <refs.txt
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: inn-src
          path: inn-src-*.tar.gz
          retention-days: 3

  ubuntu:
    name: ${{ matrix.ref }} Ubuntu ${{ matrix.cfg.name }}
    needs: source
    runs-on: ${{ matrix.cfg.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
        cfg:
          - {name: "latest, gcc", runner: ubuntu-latest, cc: gcc}
          - {name: "latest, clang", runner: ubuntu-latest, cc: clang}
          - {name: "24.04, gcc", runner: ubuntu-24.04, cc: gcc}
          - {name: "24.04 ARM64, gcc", runner: ubuntu-24.04-arm, cc: gcc}
    env:
      AUTHOR_TESTING: 1
      C_TAP_VERBOSE: 1
      COMPILER: ${{ matrix.cfg.cc }}
      REF: ${{ matrix.ref }}
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Unpack
        run: |
          tar xzf "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" --strip-components=1 inn
          rm inn-src-*.tar.gz
      - name: Install
        run: |
          grep -h '^PRETTY_NAME' /etc/os-release
          sudo -E ci/install
          sudo apt-get -qq install -y autoconf "$COMPILER" >/dev/null
      - name: ci/test
        run: ci/test

  sanitizers:
    name: ${{ matrix.ref }} Ubuntu ASan + UBSan
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # New: findings show up here first, without failing the whole run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      REF: ${{ matrix.ref }}
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Unpack
        run: |
          tar xzf "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" --strip-components=1 inn
          rm inn-src-*.tar.gz
      - name: Install
        run: sudo -E ci/install
      - name: Build
        run: |
          ./configure --disable-shared --with-openssl --with-sqlite3 --with-zlib \
              CFLAGS='-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined' \
              LDFLAGS='-fsanitize=address,undefined'
          make -j"$(nproc)"
      - name: make check
        run: make check

  distro:
    name: ${{ matrix.ref }} ${{ matrix.image }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
        image:
          - almalinux:9
          - almalinux:10
          - alpine:3.22
          - alpine:3.23
          - alpine:3.24
          - archlinux:latest
          - quay.io/centos/centos:stream9
          - quay.io/centos/centos:stream10
          - debian:12
          - debian:13
          - fedora:latest
          - gentoo/stage3:latest
          - openeuler/openeuler:25.03
          - opensuse/leap:15.6
          - opensuse/leap:16.0
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:10
          - ubuntu:24.04
          - ubuntu:25.10
          - ubuntu:26.04
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        env:
          IMAGE: ${{ matrix.image }}
          REF: ${{ matrix.ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          tar xzf "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz"
          set -- --rm -v "$PWD/inn:/src:ro" -v "$PWD/e2e-distro:/e2e-distro:ro" \
              -v "$RUNNER_TEMP/work:/work" -w /src \
              -e BUILDDIR=/work/build -e PREFIX=/opt/inn-e2e
          case "$IMAGE" in
          gentoo/*)
              # The stage3 image has no ebuild repository.
              docker create --name portage gentoo/portage:latest /bin/true
              set -- "$@" --volumes-from portage
              ;;
          esac
          docker run "$@" "$IMAGE" sh /e2e-distro
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/work/build/*.log
          if-no-files-found: ignore

  # The e2e tests of the fork's e2e branch (tests/e2e, Go) against plain
  # upstream.  They also check bugs that only fork PRs fix, so failures are
  # expected: the list in the job summary shows which fork fixes upstream
  # lacks, and shrinks as they are merged.  It never fails the run.
  e2e-upstream:
    name: ${{ matrix.ref }} e2e tests of the fork (informational)
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
    steps:
      - name: Checkout the fork's e2e branch
        uses: actions/checkout@v7
        with:
          ref: e2e
          path: e2e
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: e2e/tests/e2e/go.mod
          cache-dependency-path: e2e/tests/e2e/go.sum
      - name: Build the e2e test binary
        working-directory: e2e/tests/e2e
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/e2e/e2e.test" .
          echo "e2e tests from go-while/inn e2e $(git rev-parse --short=9 HEAD)"
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build, make check, e2e tests
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          tar xzf "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz"
          docker run --rm -v "$PWD/inn:/src:ro" -v "$PWD/e2e-distro:/e2e-distro:ro" \
              -v "$RUNNER_TEMP/e2e:/e2e:ro" -v "$RUNNER_TEMP/work:/work" -w /src \
              -e BUILDDIR=/work/build -e PREFIX=/opt/inn-e2e \
              ubuntu:26.04 sh /e2e-distro /e2e/e2e.test
      - name: Summary
        if: always()
        run: |
          log="$RUNNER_TEMP/work/build/e2e.log"
          {
            echo "### e2e tests of the fork against upstream $REF"
            echo "(e2e branch $(git -C e2e rev-parse --short=9 HEAD))"
            echo
            if [ -f "$log" ]; then
              echo "$(grep -c '^--- PASS' "$log") passed," \
                  "$(grep -c '^--- SKIP' "$log") skipped," \
                  "$(grep -c '^--- FAIL' "$log") failed"
              echo
              grep '^--- FAIL' "$log" | sed 's/^--- FAIL: \([^ ]*\).*/- \1/' || true
            else
              echo "no e2e log: the build or make check failed"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # The BSD and illumos jobs build as root in a VM.  The build and test
  # script is the same for all of them (keep the copies in step); the jobs
  # differ in the packages and in where those install.  When make check
  # fails, the failed tests are run again one by one to show their output.
  freebsd:
    name: ${{ matrix.ref }} FreeBSD
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
      CONFIGURE_ARGS: --with-sqlite3=/usr/local
      CPPFLAGS: -I/usr/local/include
      LDFLAGS: -L/usr/local/lib
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          envs: REF CONFIGURE_ARGS CPPFLAGS LDFLAGS
          usesh: true
          prepare: pkg install -y perl5 gmake sqlite3
          run: |
            set -e
            uname -a
            gzip -dc "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" | tar xf -
            cd inn
            ./configure --with-perl --with-openssl $CONFIGURE_ARGS \
                CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" >../configure.log 2>&1 \
                || { tail -n 40 ../configure.log; exit 1; }
            gmake -j2 >../make.log 2>&1 || { tail -n 60 ../make.log; exit 1; }
            echo "warnings: $(grep -c 'warning:' ../make.log || true)"
            grep 'warning:' ../make.log | sort -u | head -n 40 || true
            if ! gmake check >../check.log 2>&1; then
                grep -E 'FAILED|ABORTED|MISSED|dubious' ../check.log | head -n 40 || true
                tail -n 20 ../check.log
                cd tests
                for t in $(grep -E '\.\.\.+ *(FAILED|ABORTED|MISSED|dubious)' ../../check.log \
                        | sed 's/\.\.\..*//'); do
                    echo "======== $t"
                    ./runtests -b "$PWD" -s "$PWD" -o "$t" 2>&1 | head -n 80
                done
                exit 1
            fi
            tail -n 6 ../check.log

  openbsd:
    name: ${{ matrix.ref }} OpenBSD
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
      CONFIGURE_ARGS: --with-sqlite3=/usr/local
      CPPFLAGS: -I/usr/local/include
      LDFLAGS: -L/usr/local/lib
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        uses: vmactions/openbsd-vm@v1.4.9
        with:
          envs: REF CONFIGURE_ARGS CPPFLAGS LDFLAGS
          prepare: pkg_add -I gmake sqlite3
          run: |
            set -e
            uname -a
            gzip -dc "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" | tar xf -
            cd inn
            ./configure --with-perl --with-openssl $CONFIGURE_ARGS \
                CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" >../configure.log 2>&1 \
                || { tail -n 40 ../configure.log; exit 1; }
            gmake -j2 >../make.log 2>&1 || { tail -n 60 ../make.log; exit 1; }
            echo "warnings: $(grep -c 'warning:' ../make.log || true)"
            grep 'warning:' ../make.log | sort -u | head -n 40 || true
            if ! gmake check >../check.log 2>&1; then
                grep -E 'FAILED|ABORTED|MISSED|dubious' ../check.log | head -n 40 || true
                tail -n 20 ../check.log
                cd tests
                for t in $(grep -E '\.\.\.+ *(FAILED|ABORTED|MISSED|dubious)' ../../check.log \
                        | sed 's/\.\.\..*//'); do
                    echo "======== $t"
                    ./runtests -b "$PWD" -s "$PWD" -o "$t" 2>&1 | head -n 80
                done
                exit 1
            fi
            tail -n 6 ../check.log

  netbsd:
    name: ${{ matrix.ref }} NetBSD
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
      CONFIGURE_ARGS: --with-sqlite3=/usr/pkg
      CPPFLAGS: -I/usr/pkg/include
      LDFLAGS: -L/usr/pkg/lib -Wl,-R/usr/pkg/lib
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        uses: vmactions/netbsd-vm@v1.5.3
        with:
          envs: REF CONFIGURE_ARGS CPPFLAGS LDFLAGS
          prepare: /usr/sbin/pkg_add gmake perl sqlite3
          run: |
            set -e
            uname -a
            gzip -dc "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" | tar xf -
            cd inn
            ./configure --with-perl --with-openssl $CONFIGURE_ARGS \
                CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" >../configure.log 2>&1 \
                || { tail -n 40 ../configure.log; exit 1; }
            gmake -j2 >../make.log 2>&1 || { tail -n 60 ../make.log; exit 1; }
            echo "warnings: $(grep -c 'warning:' ../make.log || true)"
            grep 'warning:' ../make.log | sort -u | head -n 40 || true
            if ! gmake check >../check.log 2>&1; then
                grep -E 'FAILED|ABORTED|MISSED|dubious' ../check.log | head -n 40 || true
                tail -n 20 ../check.log
                cd tests
                for t in $(grep -E '\.\.\.+ *(FAILED|ABORTED|MISSED|dubious)' ../../check.log \
                        | sed 's/\.\.\..*//'); do
                    echo "======== $t"
                    ./runtests -b "$PWD" -s "$PWD" -o "$t" 2>&1 | head -n 80
                done
                exit 1
            fi
            tail -n 6 ../check.log

  dragonfly:
    name: ${{ matrix.ref }} DragonFly BSD
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
      CONFIGURE_ARGS: --with-sqlite3=/usr/local
      CPPFLAGS: -I/usr/local/include
      LDFLAGS: -L/usr/local/lib
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        uses: vmactions/dragonflybsd-vm@v1.3.4
        with:
          envs: REF CONFIGURE_ARGS CPPFLAGS LDFLAGS
          prepare: pkg install -y perl5 gmake sqlite3
          run: |
            set -e
            uname -a
            gzip -dc "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" | tar xf -
            cd inn
            ./configure --with-perl --with-openssl $CONFIGURE_ARGS \
                CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" >../configure.log 2>&1 \
                || { tail -n 40 ../configure.log; exit 1; }
            gmake -j2 >../make.log 2>&1 || { tail -n 60 ../make.log; exit 1; }
            echo "warnings: $(grep -c 'warning:' ../make.log || true)"
            grep 'warning:' ../make.log | sort -u | head -n 40 || true
            if ! gmake check >../check.log 2>&1; then
                grep -E 'FAILED|ABORTED|MISSED|dubious' ../check.log | head -n 40 || true
                tail -n 20 ../check.log
                cd tests
                for t in $(grep -E '\.\.\.+ *(FAILED|ABORTED|MISSED|dubious)' ../../check.log \
                        | sed 's/\.\.\..*//'); do
                    echo "======== $t"
                    ./runtests -b "$PWD" -s "$PWD" -o "$t" 2>&1 | head -n 80
                done
                exit 1
            fi
            tail -n 6 ../check.log

  omnios:
    name: ${{ matrix.ref }} OmniOS (illumos)
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # New and least known: don't fail the run until it has been green once.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
      # illumos' Kerberos lacks krb5_get_init_creds_opt_alloc, which
      # configure does not check for: auth_krb5 fails to link.
      CONFIGURE_ARGS: --with-sqlite3 --without-krb5
      CPPFLAGS: ""
      LDFLAGS: ""
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        uses: vmactions/omnios-vm@v1.3.8
        with:
          envs: REF CONFIGURE_ARGS CPPFLAGS LDFLAGS
          prepare: pkg install build-essential database/sqlite-3
          run: |
            set -e
            uname -a
            gzip -dc "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" | tar xf -
            cd inn
            ./configure --with-perl --with-openssl $CONFIGURE_ARGS \
                CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" >../configure.log 2>&1 \
                || { tail -n 40 ../configure.log; exit 1; }
            gmake -j2 >../make.log 2>&1 || { tail -n 60 ../make.log; exit 1; }
            echo "warnings: $(grep -c 'warning:' ../make.log || true)"
            grep 'warning:' ../make.log | sort -u | head -n 40 || true
            if ! gmake check >../check.log 2>&1; then
                grep -E 'FAILED|ABORTED|MISSED|dubious' ../check.log | head -n 40 || true
                tail -n 20 ../check.log
                cd tests
                for t in $(grep -E '\.\.\.+ *(FAILED|ABORTED|MISSED|dubious)' ../../check.log \
                        | sed 's/\.\.\..*//'); do
                    echo "======== $t"
                    ./runtests -b "$PWD" -s "$PWD" -o "$t" 2>&1 | head -n 80
                done
                exit 1
            fi
            tail -n 6 ../check.log

  # No name: GitHub never expands the matrix of a skipped job, so a name
  # with ${{ matrix.ref }} would show up unexpanded.  Without one, it shows
  # "macos" when skipped and "macos (main)" when it runs.
  macos:
    needs: source
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.source.outputs.refs) }}
    env:
      REF: ${{ matrix.ref }}
    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: inn-src
      - name: Build and make check
        run: |
          brew install sqlite openssl@3
          tar xzf "inn-src-$(printf '%s' "$REF" | tr '/' '_').tar.gz" --strip-components=1 inn
          ./configure --with-perl --with-openssl="$(brew --prefix openssl@3)" \
              --with-sqlite3="$(brew --prefix sqlite)"
          make -j"$(sysctl -n hw.ncpu)"
          make check
