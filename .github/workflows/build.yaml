##  Workflow for GitHub Actions testing.

name: build

"on": [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AUTHOR_TESTING: 1
      C_TAP_VERBOSE: 1

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: install
        run: sudo -E ci/install
      - name: test
        run: ci/test

  # Install INN, start innd and nnrpd, and run the test suite of pynntp (a
  # Python NNTP client) against them.  The runner user is INN's news user:
  # only setting innbind setuid root needs root, so that innd and nnrpd can
  # bind ports 119 and 563.
  pynntp:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: checkout pynntp
        uses: actions/checkout@v6
        with:
          repository: greenbender/pynntp
          path: pynntp
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: install
        run: |
          sudo -E ci/install
          pip install pytest ./pynntp
      - name: build and install INN
        run: |
          ./autogen
          ./configure --prefix="$RUNNER_TEMP/inn" \
              --with-news-user="$(id -un)" --with-news-group="$(id -gn)" \
              --with-openssl --with-perl
          make -j"$(nproc)"
          make install
          sudo make -C backends install-root
      - name: test
        run: ci/pynntp "$RUNNER_TEMP/inn" pynntp
      - name: syslog
        if: failure()
        run: >-
          sudo journalctl -q --no-pager -o short-precise --since "-30 min"
          -t innd -t nnrpd -t ctlinnd
